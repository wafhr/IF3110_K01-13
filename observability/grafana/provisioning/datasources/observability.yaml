apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: if3110-prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: if3110-tempo

  - name: Loki
    type: loki
    uid: if3110-loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          datasourceUid: if3110-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

  - name: Tempo
    type: tempo
    uid: if3110-tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      tracesToLogsV2:
        datasourceUid: if3110-loki
        spanStartTimeShift: '-5s'
        spanEndTimeShift: '5s'
        tags:
          - {key: service.name, value: service_name}
        filterByTraceID: true
