{{define "header"}}
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">A</span><span>Atlas<span class="brand-light">DB</span></span></a>
  <nav class="top-actions" aria-label="Main navigation">
    {{if .IsAdmin}}<a class="button ghost" href="/manage/users">Users</a><a class="button ghost" href="/manage/groups">Groups</a><a class="button ghost" href="/manage/databases">Databases</a>{{end}}

  </nav>
</header>
{{end}}
